[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gro"
version = "0.0.1"
description = "Gro query planner and optimizer handlers"
license = { text = "MIT" }
authors = [
    {name = "Renglo Team"}
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "graphforge>=0.4.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
packages = ["gro", "gro.handlers", "gro.data"]

# blueprints/*.json are staged from repo-root blueprints/ at publish time
# (see .github/workflows/publish-extension.yml). data/*.json ships from package/gro/data/.
[tool.setuptools.package-data]
gro = ["blueprints/*.json", "data/*.json"]
